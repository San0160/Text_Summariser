TrainingArguments:
  num_train_epochs: 3
  warmup_steps: 500
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  weight_decay: 0.01
  logging_steps: 10
  evaluation_strategy: epoch
  save_strategy: epoch
  gradient_accumulation_steps: 16
  load_best_model_at_end: True
  predict_with_generate: True
  fp16: True