<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text Summarise | Flan T5</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #c8f135;
      --accent-dim: rgba(200, 241, 53, 0.08);
      --text: #f0f0f0;
      --muted: #555;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,241,53,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,241,53,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      width: 100%;
      max-width: 720px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    header {
      margin-bottom: 48px;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 100px;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
    }

    .card label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      padding: 16px;
      resize: vertical;
      min-height: 240px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder {
      color: #333;
    }

    /* Counter */
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .char-count {
      font-size: 11px;
      color: var(--muted);
    }

    /* Button */
    button[type="submit"] {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #0a0a0a;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    button[type="submit"]:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }

    button[type="submit"] .arrow {
      font-size: 16px;
      transition: transform 0.2s;
    }

    button[type="submit"]:hover .arrow {
      transform: translateX(3px);
    }

    /* Loading state */
    .loading {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 16px;
    }

    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s ease infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1.2); }
    }

    /* Result */
    .result-card {
      background: var(--accent-dim);
      border: 1px solid rgba(200, 241, 53, 0.2);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
      animation: fadeUp 0.5s ease both;
    }

    .result-card .result-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .result-text {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
    }

    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 6px 12px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      margin-top: 16px;
    }

    .copy-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Error */
    .error-card {
      background: rgba(255, 80, 80, 0.06);
      border: 1px solid rgba(255, 80, 80, 0.2);
      border-radius: var(--radius);
      padding: 16px 20px;
      font-size: 13px;
      color: #ff6b6b;
      margin-bottom: 20px;
      animation: fadeUp 0.4s ease both;
    }

    /* Footer */
    footer {
      margin-top: 48px;
      font-size: 11px;
      color: #2a2a2a;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="badge">Google FLAN-T5</div>
      <h1>Make it<br/><span>shorter.</span></h1>
      <p class="subtitle">Paste any text — get a clean, concise summary instantly.</p>
    </header>

    {% if error %}
    <div class="error-card">⚠ {{ error }}</div>
    {% endif %}

    {% if summary %}
    <div class="result-card">
      <div class="result-label">// Summary</div>
      <p class="result-text" id="summaryText">{{ summary }}</p>
      <button class="copy-btn" onclick="copy()">copy to clipboard</button>
    </div>
    {% endif %}

    <div class="card">
      <form method="POST" action="/predict" onsubmit="showLoading()">
        <label for="text">// Input text</label>
        <textarea
          id="text"
          name="text"
          placeholder="Paste your article, document, or any block of text here..."
          oninput="updateCount()"
        >{% if original %}{{ original }}{% endif %}</textarea>

        <div class="meta-row">
          <span class="char-count" id="charCount">0 characters</span>
          <button type="submit">
            Summarise <span class="arrow">→</span>
          </button>
        </div>

        <div class="loading" id="loading">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <span>Summarising...</span>
        </div>
      </form>
    </div>

    <footer>Powered by Google FLAN-T5 • FastAPI</footer>
  </div>

  <script>
    function updateCount() {
      const val = document.getElementById('text').value;
      document.getElementById('charCount').textContent = val.length.toLocaleString() + ' characters';
    }

    function showLoading() {
      document.getElementById('loading').style.display = 'flex';

      const btn = document.querySelector('button[type="submit"]');

      btn.disabled = true;
      btn.innerHTML = 'Summarising <span class="arrow">...</span>';
    }
    
    function copy() {
      const text = document.getElementById('summaryText').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'copied ✓';
        setTimeout(() => {
            btn.textContent = 'copy to clipboard';}, 2000);
      });
    }

    // Init count
    updateCount();
  </script>
</body>
</html>
